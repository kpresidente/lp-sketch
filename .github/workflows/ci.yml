name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build + Unit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security audit policy gate
        run: npm run audit:prod:gate

      - name: Check shared UI contrast
        run: npm run audit:contrast

      - name: Build
        run: npm run build

      - name: Build mobile web assets
        run: npm run mobile:build

      - name: Run unit/integration tests
        run: npm run test

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke/e2e tests
        run: npm run test:e2e -- --project=chromium --workers=2 --retries=2

      - name: Exercise packaged mobile web assets at tablet size
        run: npm run test:e2e:mobile

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  merge_gate:
    name: Build + Test
    if: always()
    runs-on: ubuntu-latest
    needs:
      - validate
      - e2e
    steps:
      - name: Verify required jobs passed
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$VALIDATE_RESULT" = "success"
          test "$E2E_RESULT" = "success"
