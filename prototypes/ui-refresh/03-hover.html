<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LP Sketch — 03 Hover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#e6e4de; --canvas2:#d9d6ce;
  --glass:rgba(20,21,24,.9); --glass2:rgba(255,255,255,.08); --glass3:rgba(255,255,255,.14);
  --ink:#f5f5f2; --ink2:#c2c4c9; --ink3:#8a8e96; --ink4:#5d616a;
  --or:#ff7a1a; --or2:#ffa35c;
  --sel:#ff7a1a; --sel-fill:#fff; --sym-fill:#1a1b1e;
  --font:'Instrument Sans',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:12.5px;color:var(--ink);background:var(--canvas);overflow:hidden;-webkit-font-smoothing:antialiased;min-width:1180px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.stage{position:absolute;inset:0;background:radial-gradient(1200px 800px at 50% 40%,#edebe6 0%,var(--canvas) 55%,var(--canvas2) 100%)}
.stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(0,0,0,.09) 1px,transparent 1.3px);background-size:24px 24px;pointer-events:none}
.sheet{position:absolute;left:50%;top:53%;width:min(900px,calc(100% - 120px));transform:translate(-50%,-50%);box-shadow:0 1px 2px rgba(0,0,0,.08),0 30px 70px -25px rgba(0,0,0,.45);border-radius:3px;overflow:hidden;background:#fff}
.sheet svg{display:block;width:100%;height:auto}
.glass{position:absolute;z-index:5;background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px -12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);border-radius:14px}
.gb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 8px;border-radius:10px;color:var(--ink2);font-weight:600;font-size:12px;position:relative;transition:background .15s,color .15s}
.gb .ic{font-size:18px}
.gb:hover{background:var(--glass2);color:var(--ink)}
.gb.on{background:var(--ink);color:#111}
.gb.dis{opacity:.35;pointer-events:none}
.gdiv{width:1px;height:22px;background:rgba(255,255,255,.12);margin:0 4px;align-self:center}

/* project pill */
.proj{left:16px;top:14px;display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;height:46px}
.proj .mark{width:32px;height:32px;border-radius:9px;background:var(--or);color:#1a0d02;display:grid;place-items:center;font-size:18px}
.proj .t{font-weight:700;font-size:13px;line-height:1.1}
.proj .s{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:2px}
.proj .chev{font-size:14px;color:var(--ink3);margin-left:4px}

/* dock */
.dock{left:50%;top:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;height:46px}
.grp{display:inline-flex;align-items:center;gap:5px;padding:0 9px 0 8px;height:36px;border-radius:10px;color:var(--ink2);font-weight:600;font-size:12px}
.grp .ic{font-size:18px}
.grp .chev{font-size:13px;color:var(--ink4);margin-left:1px}
.grp:hover{background:var(--glass2);color:var(--ink)}
.grp.open{background:var(--glass3);color:var(--ink)}
.grp.open .chev{color:var(--ink2)}
.grp.cur{background:var(--or);color:#1a0d02}
.grp.cur .chev{color:rgba(26,13,2,.55)}

/* popover */
.pop{left:50%;top:70px;transform:translateX(calc(-50% - 155px));padding:10px;width:392px}
.pop::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;background:#17181b;border-left:1px solid rgba(255,255,255,.1);border-top:1px solid rgba(255,255,255,.1);transform:translateX(-50%) rotate(45deg)}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.pop-h .m{font-family:var(--mono);font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink4)}
.pop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:12px;border:1px solid transparent;color:var(--ink2);font-weight:600;font-size:11.5px}
.pt .ic{font-size:30px;color:var(--ink)}
.pt:hover{background:var(--glass2);border-color:rgba(255,255,255,.08)}
.pt.on{background:var(--ink);color:#111}
.pt.on .ic{color:#111}
.pt .kbd{font-family:var(--mono);font-size:9.5px;color:var(--ink4)}
.pt.on .kbd{color:#666}

/* actions */
.acts{right:16px;top:14px;display:flex;align-items:center;gap:2px;padding:5px;height:46px}

/* material rail */
.matrail{left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;width:52px}
.md{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;position:relative;color:var(--ink3);font-family:var(--mono);font-size:9.5px;font-weight:600}
.md i{position:absolute;inset:9px;border-radius:50%;background:var(--c)}
.md span{position:relative;z-index:1;opacity:0;transition:opacity .15s;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.md:hover span{opacity:1}
.md.on{background:var(--glass3);box-shadow:inset 0 0 0 1.5px #fff}
.md.on span{opacity:1}
.mdiv{width:26px;height:1px;background:rgba(255,255,255,.12);margin:2px 0}
.cls{display:flex;flex-direction:column;gap:3px;width:40px;padding:3px;border-radius:10px;background:rgba(0,0,0,.35)}
.cls button{height:26px;border-radius:7px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink3)}
.cls button:hover{color:var(--ink)}
.cls button.on{background:var(--ink);color:#111}

/* layers */
.layers{right:16px;top:50%;transform:translateY(-50%);width:176px;padding:8px}
.layers .h{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:2px 6px 8px}
.lr{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px;border-radius:8px;font-weight:600;font-size:12px;color:var(--ink2);cursor:pointer}
.lr:hover{background:var(--glass2)}
.lr .ic{font-size:15px;color:var(--ink3)}
.lr .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink4)}
.lr.sub{padding-left:22px;font-weight:500;color:var(--ink3)}
.lr.off{color:var(--ink4)}

/* context strip */
.ctx{left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px 6px 5px 5px;height:46px}
.ctx .tool{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:10px;background:var(--or);color:#1a0d02;font-weight:700;font-size:12px}
.ctx .tool .ic{font-size:18px}
.ctx .f{display:inline-flex;align-items:center;gap:7px;padding:0 10px;height:36px;font-weight:600;color:var(--ink2);font-size:12px}
.ctx .f .v{font-family:var(--mono);color:var(--or2);font-weight:500}
.ctx .f .v.n{color:var(--ink)}
.sw{position:relative;width:32px;height:18px;border-radius:9px;background:rgba(255,255,255,.18);display:inline-block}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.sw.on{background:var(--or)}
.sw.on::after{left:16px}
.ctx .hint{font-style:italic;color:var(--ink3);padding:0 10px 0 4px;font-size:11.5px}

/* corners */
.snaps{left:16px;bottom:16px;display:flex;gap:2px;padding:5px;height:40px}
.snaps .gb{height:30px;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:0 9px}
.snaps .gb .ic{font-size:14px}
.snaps .gb.on{background:var(--or);color:#1a0d02}
.zoomp{right:16px;bottom:16px;display:flex;align-items:center;gap:2px;padding:5px;height:40px}
.zoomp .gb{height:30px;min-width:30px;padding:0 6px}
.zoomp .gb .ic{font-size:15px}
.zoomp .v{font-family:var(--mono);font-size:11px;color:var(--ink2);padding:0 8px;min-width:58px;text-align:center}
.tag{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);z-index:4;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:rgba(0,0,0,.35);text-transform:uppercase}
.sel-badge{position:absolute;z-index:4;left:calc(50% - 80px);top:calc(53% - 238px);transform:translate(-50%,-100%);padding:4px 8px;border-radius:7px;background:var(--or);color:#1a0d02;font-weight:700;font-size:10.5px;font-family:var(--mono);white-space:nowrap;box-shadow:0 6px 16px -6px rgba(255,122,26,.7)}
.sel-badge::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--or);transform:translateX(-50%) rotate(45deg);z-index:-1}

@keyframes fadein{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:none}}
.glass,.sel-badge{animation:fadein .55s cubic-bezier(.2,.7,.2,1) both}
.dock{animation-delay:.08s}.pop{animation-delay:.22s}.acts{animation-delay:.12s}.matrail{animation-delay:.16s}.layers{animation-delay:.18s}.ctx{animation-delay:.24s}.snaps{animation-delay:.28s}.zoomp{animation-delay:.3s}.sel-badge{animation-delay:.4s}
@keyframes sheetin{from{opacity:0;transform:translate(-50%,-49%) scale(.99)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.sheet{animation:sheetin .8s cubic-bezier(.2,.7,.2,1) both}
</style>
</head>
